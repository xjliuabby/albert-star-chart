<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1767b8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Albert打卡"><title>Albert 打卡表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#173d70;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:760px;margin:auto;padding:14px 14px 45px}header{background:linear-gradient(115deg,#1666b8,#52a8f2);color:white;border-radius:24px;text-align:center;padding:22px 10px;margin-bottom:14px}h1{margin:0;font-size:32px}header p{margin:8px 0 0}.panel{background:white;border:2px solid #b9ddff;border-radius:22px;padding:17px;margin:14px 0;box-shadow:0 3px 8px #c7def444}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}select,button{font:inherit;border-radius:12px;padding:10px;border:1px solid #91bde8;background:white;color:#174a80}select{max-width:100%;width:100%;margin-top:8px;font-size:17px}.stats{font-size:29px;color:#0966b8;font-weight:800;margin:8px 0}.muted{color:#627d9c;font-size:14px}.bar{height:12px;background:#e2ecf8;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#ffc83d;transition:width .2s}.day{background:white;border:2px solid #b9ddff;border-radius:20px;padding:14px;margin:12px 0}.day.today{border-color:#ffbf37;background:#fffdf6}.day h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between}.stars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.star{border:1px solid #b9d6f4;background:#f2f7fd;border-radius:14px;min-height:56px;font-size:32px;line-height:1;color:#7b94b0;touch-action:manipulation;cursor:pointer}.star.on{color:#e7a000;background:#fff1bd;border-color:#ffc64c}.section-title{font-size:21px;font-weight:800;margin:20px 2px 8px}details summary{font-size:20px;font-weight:700;cursor:pointer}li{margin:10px 0;line-height:1.5}ol{padding-left:26px}.reward{padding:10px 0;border-bottom:1px dashed #b5cde9}.reward:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#e7f3ff}.note{font-size:13px;color:#607a96;line-height:1.6}#notice{color:#a04816;font-size:13px}input[type=file]{max-width:100%}
.redeemForm{display:grid;gap:10px}.redeemForm label{font-weight:700}.redeemForm input,.redeemForm select{width:100%;font:inherit;padding:12px;border:1px solid #91bde8;border-radius:12px;background:white;color:#173d70}.primary{background:#1767b8;color:white;border:0;font-weight:700;padding:13px}.ledgerItem{padding:12px 0;border-bottom:1px solid #d8e7f6}.ledgerItem:last-child{border:0}.danger{color:#9a3c26}</style></head><body><main><header><h1>🚀 Albert 打卡表 🏆</h1><p>每天努力一点点，收集闪亮小星星 ⭐</p></header>
<section class="panel"><label for="period"><strong>打卡周期</strong></label><select id="period"></select><div class="topline"><div><div class="muted">本期获得星星</div><div class="stats"><span id="count">0</span> / 280 ⭐</div></div><div id="next" style="font-weight:700"></div></div><div class="bar"><div id="fill" class="fill"></div></div><div class="muted" id="allcount"></div><div class="stats" style="font-size:24px">可兑换余额：<span id="balance">0</span> ⭐</div><div class="muted" id="spent"></div></section>
<section class="panel"><details id="redeemDetails"><summary>🎁 兑换星星</summary><form id="redeemForm" class="redeemForm" style="margin-top:14px"><label for="rewardChoice">兑换原因</label><select id="rewardChoice" required></select><label for="redeemAmount">使用星星数量</label><input id="redeemAmount" type="number" min="1" step="1" required><label for="redeemDate">兑换日期</label><input id="redeemDate" type="date" required><label for="redeemReason">备注（可选）</label><input id="redeemReason" type="text" maxlength="120" placeholder="例如：兑换了Lego赛车"><button class="primary" type="submit">确认兑换并扣除星星</button><div id="redeemNotice" class="danger" role="status"></div></form></details><h3>📒 兑换记录</h3><div id="ledger"></div></section><div class="section-title">👇 点击每天的空心星星 ☆ 打卡</div><div class="muted">每天10颗星，两排各5颗。再点一次可取消。</div><div id="days"></div>
<details class="panel"><summary>🌟 获得一颗星的条件（17条）</summary><ol id="conditions"></ol></details>
<details class="panel"><summary>🎁 奖励规则（6条）</summary><div id="rewards"></div></details>
<section class="panel"><strong>💾 备份与恢复</strong><p class="note">打卡保存在当前浏览器本地。换手机或清除网站数据可能丢失，请定期导出备份。</p><div class="actions"><button id="export">导出备份</button><button id="importButton">导入备份</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><p id="notice"></p></section>
</main><script>
(function(){
"use strict";
const conditions=["学校完成作业","钢琴课不迟到","晚上八点二十前睡觉","作业非常工整","拿到 link letter","考试一百分","拿到奖","不捣蛋不闹人","干事很利索","谷雨书院作业全做完","不用提醒干下一件事","老师的要求都完成","连续一周拉臭","音乐课作业完成","中途能停下来干重要的事情","早上七点半到学校","自己十五分钟内吃完饭"];
const rewards=[[4,"lucky超市，看十分钟视频"],[75,"Lego赛车"],[65,"拼图"],[20,"小块蛋糕"],[50,"大蛋糕"],[35,"玩具，二十五美元以内"]];
const key="albert-star-chart-v2",ledgerKey="albert-star-chart-redemptions-v1";let redemptions=[];try{const x=JSON.parse(localStorage.getItem(ledgerKey)||"[]");if(Array.isArray(x))redemptions=x.filter(r=>r&&Number.isInteger(r.amount)&&r.amount>0&&typeof r.date==="string"&&typeof r.reason==="string")}catch(e){}let data={};try{const x=JSON.parse(localStorage.getItem(key)||"{}");if(x&&typeof x==="object"&&!Array.isArray(x))data=x}catch(e){}
const $=id=>document.getElementById(id),base=new Date(2026,10,9,12),dayMs=86400000,week=["周日","周一","周二","周三","周四","周五","周六"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dateAt=n=>new Date(base.getTime()+n*dayMs);const fmt=d=>(d.getMonth()+1)+"/"+d.getDate();
const today=new Date();let current=Math.max(0,Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate(),12)-base)/(28*dayMs)));if(!Number.isFinite(current))current=0;
function earned(){return Object.values(data).reduce((sum,a)=>sum+(Array.isArray(a)?a.filter(Boolean).length:0),0)}function spent(){return redemptions.reduce((sum,r)=>sum+r.amount,0)}function balance(){return earned()-spent()}function saveLedger(){try{localStorage.setItem(ledgerKey,JSON.stringify(redemptions));return true}catch(e){$("redeemNotice").textContent="保存兑换记录失败。";return false}}function renderLedger(){const root=$("ledger");root.innerHTML="";if(!redemptions.length){root.textContent="还没有兑换记录。";return}redemptions.slice().reverse().forEach(r=>{const div=document.createElement("div");div.className="ledgerItem";const strong=document.createElement("strong");strong.textContent=r.date+" · -"+r.amount+" ⭐";div.append(strong);const detail=document.createElement("div");detail.textContent=r.reason+(r.note?"（"+r.note+"）":"");div.append(detail);root.append(div)})}function save(){try{localStorage.setItem(key,JSON.stringify(data));$("notice").textContent=""}catch(e){$("notice").textContent="当前浏览器未能保存数据，请使用 Safari 正式网址并及时备份。"}}
function periodLabel(i){return "第"+(i+1)+"期 · "+fmt(dateAt(i*28))+"–"+fmt(dateAt(i*28+27))}
function refreshPeriods(){const sel=$("period");sel.innerHTML="";const n=Math.max(3,current+2);for(let i=0;i<n;i++){let o=document.createElement("option");o.value=i;o.textContent=periodLabel(i);sel.append(o)}sel.value=current}
function render(){refreshPeriods();const days=$("days");days.innerHTML="";let total=0;for(let i=0;i<28;i++){const d=dateAt(current*28+i),id=iso(d),arr=Array.isArray(data[id])?data[id]:[],card=document.createElement("section");card.className="day"+(iso(d)===iso(today)?" today":"");let h=document.createElement("h3");h.textContent=week[d.getDay()]+" · "+fmt(d);let c=document.createElement("span");c.className="muted";c.textContent=arr.filter(Boolean).length+"/10 ⭐";h.append(c);card.append(h);let grid=document.createElement("div");grid.className="stars";for(let j=0;j<10;j++){const on=!!arr[j];if(on)total++;let b=document.createElement("button");b.type="button";b.className="star"+(on?" on":"");b.textContent=on?"★":"☆";b.setAttribute("aria-label",fmt(d)+" 第"+(j+1)+"颗星 "+(on?"取消":"点亮"));b.setAttribute("aria-pressed",on?"true":"false");b.onclick=()=>{let next=Array.isArray(data[id])?data[id].slice(0,10):Array(10).fill(false);next[j]=!next[j];data[id]=next;save();render();};grid.append(b)}card.append(grid);days.append(card)}
$("count").textContent=total;$("fill").style.width=(total/280*100)+"%";const milestones=[4,20,35,50,65,75];const next=milestones.find(x=>x>total);$("next").textContent=next?"距离下一档奖励\n还差"+(next-total)+"颗星":"已达到全部奖励档位！";$("allcount").textContent="所有期累计获得："+earned()+"颗";$("balance").textContent=balance();$("spent").textContent="已兑换使用："+spent()+"颗";renderLedger();}
$("period").onchange=e=>{current=Number(e.target.value);render()};
conditions.forEach(t=>{let li=document.createElement("li");li.textContent=t;$("conditions").append(li)});
rewards.forEach(([n,t])=>{let opt=document.createElement("option");opt.value=t;opt.dataset.amount=n;opt.textContent=n+"颗星："+t;$("rewardChoice").append(opt)});$("rewardChoice").append(new Option("其他（自定义原因）","other"));$("rewardChoice").onchange=()=>{const opt=$("rewardChoice").selectedOptions[0];if(opt.dataset.amount)$("redeemAmount").value=opt.dataset.amount;$("redeemReason").placeholder=opt.value==="other"?"请填写兑换原因":"备注（可选）"};$("rewardChoice").dispatchEvent(new Event("change"));$("redeemDate").value=iso(today);$("redeemForm").onsubmit=e=>{e.preventDefault();const amount=Number($("redeemAmount").value),reason=$("rewardChoice").value==="other"?$("redeemReason").value.trim():$("rewardChoice").value,date=$("redeemDate").value,note=$("rewardChoice").value==="other"?"":$("redeemReason").value.trim();if(!Number.isSafeInteger(amount)||amount<=0||!reason||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)){$("redeemNotice").textContent="请填写有效的日期、兑换原因和星星数量。";return}if(amount>balance()){$("redeemNotice").textContent="星星不足，目前可用"+balance()+"颗。";return}if(!confirm("确定在"+date+"因「"+reason+"」兑换"+amount+"颗星吗？"))return;redemptions.push({id:Date.now()+"-"+Math.random().toString(36).slice(2),date,reason,note,amount});if(!saveLedger()){redemptions.pop();return}$("redeemNotice").textContent="兑换成功，已扣除"+amount+"颗星。";$("redeemReason").value="";render()};rewards.forEach(([n,t])=>{let div=document.createElement("div");div.className="reward";div.textContent="⭐ "+n+"颗星："+t;$("rewards").append(div)});
$("export").onclick=()=>{const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),stars:data,redemptions:redemptions},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="Albert打卡备份-"+iso(today)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
$("importButton").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj.stars||typeof obj.stars!=="object"||Array.isArray(obj.stars))throw Error("格式错误");if(!confirm("导入备份会替换当前打卡记录，确定继续吗？"))return;const imported=Array.isArray(obj.redemptions)?obj.redemptions:[];if(imported.some(r=>!r||!Number.isSafeInteger(r.amount)||r.amount<=0||typeof r.reason!=="string"||typeof r.date!=="string"))throw Error("兑换记录格式错误");data=obj.stars;redemptions=imported;save();saveLedger();render();$("notice").textContent="备份导入完成。"}catch(err){$("notice").textContent="导入失败：文件格式不正确。"}e.target.value=""};
render();
})();
</script></body></html>
