<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1767b8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Albert打卡"><title>Albert 打卡表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff6ff;color:#173d70;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:760px;margin:auto;padding:14px 14px 45px}header{background:linear-gradient(115deg,#1666b8,#52a8f2);color:white;border-radius:24px;text-align:center;padding:22px 10px;margin-bottom:14px}h1{margin:0;font-size:32px}header p{margin:8px 0 0}.panel{background:white;border:2px solid #b9ddff;border-radius:22px;padding:17px;margin:14px 0;box-shadow:0 3px 8px #c7def444}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}select,button{font:inherit;border-radius:12px;padding:10px;border:1px solid #91bde8;background:white;color:#174a80}select{max-width:100%;width:100%;margin-top:8px;font-size:17px}.stats{font-size:29px;color:#0966b8;font-weight:800;margin:8px 0}.muted{color:#627d9c;font-size:14px}.bar{height:12px;background:#e2ecf8;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#ffc83d;transition:width .2s}.day{background:white;border:2px solid #b9ddff;border-radius:20px;padding:14px;margin:12px 0}.day.today{border-color:#ffbf37;background:#fffdf6}.day h3{margin:0 0 12px;font-size:19px;display:flex;justify-content:space-between}.stars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.star{border:1px solid #b9d6f4;background:#f2f7fd;border-radius:14px;min-height:56px;font-size:32px;line-height:1;color:#7b94b0;touch-action:manipulation;cursor:pointer}.star.on{color:#e7a000;background:#fff1bd;border-color:#ffc64c}.section-title{font-size:21px;font-weight:800;margin:20px 2px 8px}details summary{font-size:20px;font-weight:700;cursor:pointer}li{margin:10px 0;line-height:1.5}ol{padding-left:26px}.reward{padding:10px 0;border-bottom:1px dashed #b5cde9}.reward:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#e7f3ff}.note{font-size:13px;color:#607a96;line-height:1.6}#notice{color:#a04816;font-size:13px}input[type=file]{max-width:100%}
.redeemForm{display:grid;gap:10px}.redeemForm label{font-weight:700}.redeemForm input,.redeemForm select{width:100%;font:inherit;padding:12px;border:1px solid #91bde8;border-radius:12px;background:white;color:#173d70}.primary{background:#1767b8;color:white;border:0;font-weight:700;padding:13px}.ledgerItem{padding:12px 0;border-bottom:1px solid #d8e7f6}.ledgerItem:last-child{border:0}.danger{color:#9a3c26}</style></head><body><main><header><h1>🚀 Albert 打卡表 🏆</h1><p>每天努力一点点，收集闪亮小星星 ⭐</p></header>
<section class="panel" id="authPanel"><div class="topline"><strong>☁️ 家庭云端同步</strong><span id="cloudStatus" class="muted">正在连接…</span></div><form id="loginForm" class="redeemForm" style="margin-top:12px"><label>家庭账号邮箱<input id="loginEmail" type="email" autocomplete="username" required placeholder="邮箱"></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Firebase Authentication 密码"></label><button class="primary" type="submit">登录并同步</button></form><button id="logout" type="button" hidden>退出家庭账号</button><p class="note" id="cloudHint">请先在保存旧打卡记录的设备上登录，首次会将本地记录迁移到空的云端账户。</p></section><section class="panel"><label for="period"><strong>打卡周期</strong></label><select id="period"></select><div class="topline"><div><div class="muted">本期获得星星</div><div class="stats"><span id="count">0</span> / 280 ⭐</div></div><div id="next" style="font-weight:700"></div></div><div class="bar"><div id="fill" class="fill"></div></div><div class="muted" id="allcount"></div><div class="stats" style="font-size:24px">可兑换余额：<span id="balance">0</span> ⭐</div><div class="muted" id="spent"></div></section>
<section class="panel"><details id="redeemDetails"><summary>🎁 兑换星星</summary><form id="redeemForm" class="redeemForm" style="margin-top:14px"><label for="rewardChoice">兑换原因</label><select id="rewardChoice" required></select><label for="redeemAmount">使用星星数量</label><input id="redeemAmount" type="number" min="1" step="1" required><label for="redeemDate">兑换日期</label><input id="redeemDate" type="date" required><label for="redeemReason">备注（可选）</label><input id="redeemReason" type="text" maxlength="120" placeholder="例如：兑换了Lego赛车"><button class="primary" type="submit">确认兑换并扣除星星</button><div id="redeemNotice" class="danger" role="status"></div></form></details><h3>📒 兑换记录</h3><div id="ledger"></div></section><div class="section-title">👇 点击每天的空心星星 ☆ 打卡</div><div class="muted">每天10颗星，两排各5颗。再点一次可取消。</div><div id="days"></div>
<details class="panel"><summary>🌟 获得一颗星的条件（17条）</summary><ol id="conditions"></ol></details>
<details class="panel"><summary>🎁 奖励规则（6条）</summary><div id="rewards"></div></details>
<section class="panel"><strong>💾 备份与恢复</strong><p class="note">打卡保存在当前浏览器本地。换手机或清除网站数据可能丢失，请定期导出备份。</p><div class="actions"><button id="export">导出备份</button><button id="importButton">导入备份</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><p id="notice"></p></section>
</main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,onSnapshot,runTransaction} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB8OXHtsaThJ_QKOEwfrfQSl5T2_Imw1yM",authDomain:"albert-star-chart.firebaseapp.com",projectId:"albert-star-chart",storageBucket:"albert-star-chart.firebasestorage.app",messagingSenderId:"907137608447",appId:"1:907137608447:web:51dcf25c19a45a662dfaca",measurementId:"G-XL46JZRKPG"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),conditions=["学校完成作业","钢琴课不迟到","晚上八点二十前睡觉","作业非常工整","拿到 link letter","考试一百分","拿到奖","不捣蛋不闹人","干事很利索","谷雨书院作业全做完","不用提醒干下一件事","老师的要求都完成","连续一周拉臭","音乐课作业完成","中途能停下来干重要的事情","早上七点半到学校","自己十五分钟内吃完饭"];
const rewards=[[4,"lucky超市，看十分钟视频"],[75,"Lego赛车"],[65,"拼图"],[20,"小块蛋糕"],[50,"大蛋糕"],[35,"玩具，二十五美元以内"]];
const starKey="albert-star-chart-v2",redeemKey="albert-star-chart-redemptions-v1";
const read=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??fallback}catch{return fallback}};
const localStars=read(starKey,{}),localRedemptions=read(redeemKey,[]);
let stars=localStars&&typeof localStars==="object"&&!Array.isArray(localStars)?localStars:{},redemptions=Array.isArray(localRedemptions)?localRedemptions:[];
let user=null,cloudRef=null,unsub=null,ready=false,busy=false,revision=0;
const base=new Date(2026,10,9,12),ms=86400000,today=new Date(),iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),dateAt=n=>new Date(base.getTime()+n*ms),fmt=d=>(d.getMonth()+1)+"/"+d.getDate(),week=["周日","周一","周二","周三","周四","周五","周六"];
let current=Math.max(0,Math.floor((new Date(today.getFullYear(),today.getMonth(),today.getDate(),12)-base)/(28*ms)));
const earned=s=>Object.values(s).reduce((n,a)=>n+(Array.isArray(a)?a.filter(Boolean).length:0),0);
const spent=r=>r.reduce((n,x)=>n+(Number(x.amount)||0),0);
const balance=(s=stars,r=redemptions)=>earned(s)-spent(r);
const validStars=s=>s&&typeof s==="object"&&!Array.isArray(s);
const validRedeems=r=>Array.isArray(r)&&r.every(x=>x&&Number.isSafeInteger(x.amount)&&x.amount>0&&typeof x.reason==="string"&&typeof x.date==="string");
const persist=()=>{try{localStorage.setItem(starKey,JSON.stringify(stars));localStorage.setItem(redeemKey,JSON.stringify(redemptions))}catch(e){$("notice").textContent="本地保存失败，请导出备份。"}};
const status=t=>$("cloudStatus").textContent=t;
const hint=t=>$("cloudHint").textContent=t;
const error=e=>{status("同步错误");hint("云端操作失败："+(e?.message||String(e))+"。请检查 Firestore Rules 和网络连接。")};
function render(){
 const sel=$("period");sel.innerHTML="";for(let p=0;p<Math.max(3,current+2);p++){const o=new Option("第"+(p+1)+"期 · "+fmt(dateAt(p*28))+"–"+fmt(dateAt(p*28+27)),String(p));sel.add(o)}sel.value=current;
 const days=$("days");days.innerHTML="";let periodEarned=0;
 for(let i=0;i<28;i++){const date=dateAt(current*28+i),id=iso(date),arr=Array.isArray(stars[id])?stars[id]:[],card=document.createElement("section");card.className="day"+(id===iso(today)?" today":"");
 const heading=document.createElement("h3");heading.textContent=week[date.getDay()]+" · "+fmt(date);const c=document.createElement("span");c.className="muted";c.textContent=arr.filter(Boolean).length+"/10 ⭐";heading.append(c);card.append(heading);
 const grid=document.createElement("div");grid.className="stars";
 for(let j=0;j<10;j++){const on=!!arr[j];if(on)periodEarned++;const b=document.createElement("button");b.type="button";b.className="star"+(on?" on":"");b.textContent=on?"★":"☆";b.disabled=!ready||busy;b.setAttribute("aria-label",fmt(date)+" 第"+(j+1)+"颗星 "+(on?"取消":"点亮"));b.setAttribute("aria-pressed",String(on));b.onclick=()=>changeStar(id,j);grid.append(b)}card.append(grid);days.append(card)}
 $("count").textContent=periodEarned;$("fill").style.width=(periodEarned/280*100)+"%";$("allcount").textContent="所有期累计获得："+earned(stars)+"颗";$("balance").textContent=balance();$("spent").textContent="已兑换使用："+spent(redemptions)+"颗";
 const next=[4,20,35,50,65,75].find(n=>n>balance());$("next").textContent=next?"距离下一档奖励还差"+(next-balance())+"颗星":"余额已达到全部奖励档位！";
 const ledger=$("ledger");ledger.innerHTML="";if(!redemptions.length)ledger.textContent="还没有兑换记录。";else redemptions.slice().reverse().forEach(r=>{const div=document.createElement("div");div.className="ledgerItem";const h=document.createElement("strong");h.textContent=r.date+" · -"+r.amount+" ⭐";div.append(h);const t=document.createElement("div");t.textContent=r.reason+(r.note?"（"+r.note+"）":"");div.append(t);ledger.append(div)});
 $("redeemForm").querySelector("button[type=submit]").disabled=!ready||busy;
}
async function transact(fn){
 if(!ready||busy||!cloudRef)return;busy=true;render();try{await runTransaction(db,async tx=>{const snap=await tx.get(cloudRef);if(!snap.exists())throw Error("云端记录尚未初始化");const original=snap.data(),s=structuredClone(original.stars||{}),r=structuredClone(original.redemptions||[]);fn(s,r);tx.set(cloudRef,{stars:s,redemptions:r,updatedAt:new Date().toISOString()})});status("已同步 ☁️")}catch(e){error(e)}finally{busy=false;render()}
}
function changeStar(id,j){transact((s)=>{const a=Array.isArray(s[id])?s[id].slice(0,10):Array(10).fill(false);while(a.length<10)a.push(false);a[j]=!a[j];s[id]=a})}
$("period").onchange=e=>{current=Number(e.target.value);render()};
conditions.forEach(t=>{const li=document.createElement("li");li.textContent=t;$("conditions").append(li)});
rewards.forEach(([n,t])=>{const o=new Option(n+"颗星："+t,t);o.dataset.amount=n;$("rewardChoice").add(o);const div=document.createElement("div");div.className="reward";div.textContent="⭐ "+n+"颗星："+t;$("rewards").append(div)});
$("rewardChoice").add(new Option("其他（自定义原因）","other"));
$("rewardChoice").onchange=()=>{const o=$("rewardChoice").selectedOptions[0];if(o.dataset.amount)$("redeemAmount").value=o.dataset.amount;$("redeemReason").placeholder=o.value==="other"?"请填写兑换原因":"备注（可选）"};
$("rewardChoice").dispatchEvent(new Event("change"));$("redeemDate").value=iso(today);
$("redeemForm").onsubmit=e=>{e.preventDefault();const amount=Number($("redeemAmount").value),reason=$("rewardChoice").value==="other"?$("redeemReason").value.trim():$("rewardChoice").value,date=$("redeemDate").value,note=$("rewardChoice").value==="other"?"":$("redeemReason").value.trim();if(!Number.isSafeInteger(amount)||amount<1||!reason||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date)){$("redeemNotice").textContent="请填写有效的兑换原因、日期和数量。";return}if(amount>balance()){$("redeemNotice").textContent="余额不足。";return}if(!confirm("确定兑换"+amount+"颗星，用于「"+reason+"」吗？"))return;transact((s,r)=>{if(amount>balance(s,r))throw Error("余额不足，请刷新后重试");r.push({id:crypto.randomUUID(),amount,reason,date,note})}).then(()=>{$("redeemReason").value=""})};
$("export").onclick=()=>{const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),stars,redemptions},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Albert打卡备份-"+iso(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
$("importButton").onclick=()=>$("importFile").click();
$("importFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!validStars(x.stars)||!validRedeems(x.redemptions||[]))throw Error("备份格式错误");if(!ready)throw Error("请先登录并连接云端");if(!confirm("导入会覆盖整个家庭云端打卡记录，确定吗？"))return;await transact((s,r)=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,x.stars);r.splice(0,r.length,...(x.redemptions||[]))})}catch(err){$("notice").textContent=err.message}finally{e.target.value=""}};
$("loginForm").onsubmit=async e=>{e.preventDefault();status("正在登录…");try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value)}catch(err){error(err)}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(unsub){unsub();unsub=null}ready=false;user=u;cloudRef=null;render();
 if(!u){status("未登录");hint("请先在保存旧打卡记录的设备上登录。登录后自动同步。");$("loginForm").hidden=false;$("logout").hidden=true;return}
 $("loginForm").hidden=true;$("logout").hidden=false;$("loginPassword").value="";status("连接云端…");cloudRef=doc(db,"families",u.uid);
 try{
  const firstLocalStars=read(starKey,{}),firstLocalRedemptions=read(redeemKey,[]);
  const hasLocal=earned(firstLocalStars)>0||(Array.isArray(firstLocalRedemptions)&&firstLocalRedemptions.length>0);
  let initialized=false;
  await runTransaction(db,async tx=>{const snap=await tx.get(cloudRef);if(!snap.exists()){tx.set(cloudRef,{stars:validStars(firstLocalStars)?firstLocalStars:{},redemptions:validRedeems(firstLocalRedemptions)?firstLocalRedemptions:[],updatedAt:new Date().toISOString()});initialized=true}});
  if(initialized&&hasLocal)hint("已把这台设备的旧记录迁移到云端。其他设备请登录相同账号。");
  else {if(hasLocal){try{const k="albert-precloud-backup-"+u.uid;if(!localStorage.getItem(k))localStorage.setItem(k,JSON.stringify({stars:firstLocalStars,redemptions:firstLocalRedemptions}))}catch(e){}}hint("云端数据已存在，将以云端为准；本设备原有记录已另存本地备份，不会覆盖云端。");}
  unsub=onSnapshot(cloudRef,snap=>{if(!snap.exists())return;const v=snap.data();if(!validStars(v.stars)||!validRedeems(v.redemptions||[])){status("云端数据格式错误");return}stars=v.stars;redemptions=v.redemptions||[];ready=true;persist();status(snap.metadata.fromCache?"离线缓存（请联网）":"已同步 ☁️");render()},error);
 }catch(e){error(e)}
});
status("请登录家庭账号");render();
</script></body></html>
